<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>1:1 Real-Scale AR Stone Studio | Murali Granites & Marbles</title>
  <meta name="description" content="Project natural marble and granite slabs into your actual room using your mobile camera in real scale.">

  <!-- Tailwind CSS & Brand Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/navigation.css">

  <!-- Three.js for 3D Camera AR rendering -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <style>
    :root {
      --gold: #C5A059;
      --gold-light: #E7C887;
      --gold-dark: #8F7034;
      --obsidian: #0E0E10;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--obsidian);
      color: #F4F4F5;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
      -webkit-user-select: none;
    }
    .brand-font {
      font-family: 'Cinzel', serif;
    }
    #cameraVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    #arCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      touch-action: none;
    }
    .stone-card {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .stone-card.active {
      border-color: var(--gold);
      box-shadow: 0 0 16px rgba(197, 160, 89, 0.35);
      transform: translateY(-2px);
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(197, 160, 89, 0.4);
      border-radius: 4px;
    }
    .ar-btn-pulse {
      box-shadow: 0 0 0 0 rgba(197, 160, 89, 0.7);
      animation: pulse-gold 2s infinite cubic-bezier(0.66, 0, 0, 1);
    }
    @keyframes pulse-gold {
      to {
        box-shadow: 0 0 0 18px rgba(197, 160, 89, 0);
      }
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen relative bg-[#0E0E10]">

  <!-- 1. Real Device Camera Feed (Revealed when camera is started) -->
  <video id="cameraVideo" playsinline autoplay muted class="hidden"></video>

  <!-- 2. Three.js 3D WebGL Canvas Layer -->
  <canvas id="arCanvas"></canvas>

  <!-- 3. Top Floating Navigation & Controls -->
  <header class="absolute top-0 left-0 right-0 z-30 px-4 py-3 bg-gradient-to-b from-[#0E0E10]/95 via-[#0E0E10]/80 to-transparent flex items-center justify-between pointer-events-auto">
    <div class="flex items-center gap-3">
      <a href="visualizer-2.html" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 border border-white/10 flex items-center justify-center text-sm font-bold text-white transition">
        &larr;
      </a>
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-xs uppercase tracking-widest text-[#C5A059] font-bold" id="arStatusBadge">Live 1:1 Scale</span>
        </div>
        <h1 class="text-sm sm:text-base font-bold text-white brand-font tracking-wide" id="arStoneTitle">River Black Granite</h1>
      </div>
    </div>

    <!-- Mode Selector: Standing Slab vs Floor Paving -->
    <div class="flex items-center bg-black/60 backdrop-blur-md p-1 rounded-full border border-white/10 text-xs">
      <button id="btnModelSlab" class="px-3 py-1.5 rounded-full font-semibold transition bg-[#C5A059] text-black" onclick="switchModel('slab')">
        10×6 ft Slab
      </button>
      <button id="btnModelFloor" class="px-3 py-1.5 rounded-full font-semibold transition text-zinc-400 hover:text-white" onclick="switchModel('floor')">
        8×8 ft Floor
      </button>
    </div>
  </header>

  <!-- 4. Camera Permission & Start Banner (Prominently displayed) -->
  <div id="cameraBanner" class="absolute top-20 left-4 right-4 z-30 flex justify-center pointer-events-none">
    <button id="btnStartCamera" onclick="initDeviceCamera()" class="pointer-events-auto ar-btn-pulse flex items-center gap-2.5 px-6 py-3 rounded-full bg-gradient-to-r from-[#E7C887] via-[#C5A059] to-[#8F7034] text-black font-bold text-sm shadow-2xl border border-white/40 hover:brightness-110 active:scale-95 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3"/></svg>
      <span id="btnStartCameraText">Open Camera &amp; Project in Room</span>
    </button>
  </div>

  <!-- 5. Real-World Scale HUD & Instructions -->
  <div class="absolute bottom-28 left-4 z-20 bg-black/75 backdrop-blur-md px-3.5 py-2 rounded-xl border border-white/10 text-xs pointer-events-none">
    <span class="text-zinc-400 block text-[10px] uppercase font-bold tracking-wider">Physical Dimensions (1:1)</span>
    <span class="text-[#E7C887] font-mono font-bold" id="arDimensions">2.80m × 1.60m × 20mm (10 × 5.5 ft)</span>
    <span class="text-[10px] text-zinc-400 block mt-0.5">Drag to move • Pinch to resize • 2 fingers to rotate</span>
  </div>

  <!-- 6. Desktop QR Scan Helper (Visible on wide laptop screens) -->
  <div id="desktopQrNotice" class="hidden sm:flex absolute top-20 right-4 bg-[#141417]/95 border border-[#C5A059]/40 rounded-2xl p-4 max-w-xs shadow-2xl backdrop-blur-md flex-col items-center text-center z-20">
    <div class="text-[11px] uppercase tracking-wider text-[#C5A059] font-bold mb-1">Scan to Open on Phone</div>
    <div class="text-xs text-zinc-300 mb-3">Scan with your iPhone or Android to open your camera and preview this slab on your floor:</div>
    <div class="bg-white p-2.5 rounded-xl shadow-inner mb-2">
      <img id="qrImg" src="" alt="Scan for AR" class="w-36 h-36">
    </div>
    <!-- Network IP vs Cloud Switcher -->
    <div class="flex gap-1 text-[10px] w-full mt-1">
      <button id="btnQrWifi" class="flex-1 py-1 rounded bg-[#C5A059] text-black font-bold" onclick="setQrType('wifi')">Wi-Fi (Fast)</button>
      <button id="btnQrCloud" class="flex-1 py-1 rounded bg-white/10 text-zinc-300" onclick="setQrType('cloud')">GitHub Pages</button>
    </div>
  </div>

  <!-- 7. Bottom Stone Swatches Dock -->
  <footer class="absolute bottom-0 left-0 right-0 z-30 bg-gradient-to-t from-[#0E0E10] via-[#0E0E10]/95 to-transparent pt-6 pb-4 px-4 pointer-events-auto">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold text-zinc-400">Choose Stone Texture:</span>
      <div class="flex items-center gap-3">
        <button onclick="resetSlabPosition()" class="text-xs text-zinc-300 hover:text-white flex items-center gap-1 font-semibold">
          <span>↺ Reset Position</span>
        </button>
        <button onclick="shareToWhatsApp()" class="text-xs text-emerald-400 hover:text-emerald-300 flex items-center gap-1 font-semibold">
          <span>💬 WhatsApp Quote</span>
        </button>
      </div>
    </div>

    <!-- Horizontal Stone Swatches -->
    <div id="stoneDock" class="flex gap-3 overflow-x-auto pb-2 custom-scrollbar">
      <!-- Injected via JavaScript -->
    </div>
  </footer>

  <script>
    // ── Built-in Stone Catalog ──
    const STONES = [
      { id: 'river_black', name: 'River Black', cat: 'Granite', url: '../assets/images/products/product-1783138465-6a4888a145274.webp' },
      { id: 'alaska_white', name: 'Alaska White', cat: 'Granite', url: '../assets/images/products/product-1783084356-6a47b5441b767.webp' },
      { id: 'banswara_marble', name: 'Banswara Marble', cat: 'Marble', url: '../assets/images/products/product-1783085208-6a47b8986af97.webp' },
      { id: 'emerald_onyx', name: 'Emerald Onyx Marble', cat: 'Onyx', url: '../assets/images/products/product-1783085161-6a47b869e0448.webp' },
      { id: 'black_pearl', name: 'Black Pearl', cat: 'Granite', url: '../assets/images/products/product-1783138424-6a488878abc22.webp' },
      { id: 'tan_brown', name: 'Tan Brown', cat: 'Granite', url: '../assets/images/products/product-1783084011-6a47b3eb20cf0.webp' },
      { id: 'titanium_black', name: 'Titanium Black', cat: 'Granite', url: '../assets/images/products/product-1783083560-6a47b228132ac.webp' },
      { id: 'blue_in_the_night', name: 'Blue in the Night', cat: 'Imported', url: '../assets/images/products/product-1783085244-6a47b8bcd330d.webp' },
      { id: 'marie_gold', name: 'Marie Gold', cat: 'Granite', url: '../assets/images/products/product-1783085317-6a47b9058f71e.webp' },
      { id: 'moon_white', name: 'Moon White', cat: 'Granite', url: '../assets/images/products/product-1783079448-6a47a218632fd.webp' }
    ];

    let currentStone = STONES[0];
    let currentModelType = 'slab'; // 'slab' or 'floor'
    let isCameraActive = false;

    // Parse URL params
    const urlParams = new URLSearchParams(window.location.search);
    const stoneReq = urlParams.get('stone') || urlParams.get('name');
    const customImg = urlParams.get('img');
    const modelReq = urlParams.get('model');
    if (modelReq === 'floor') currentModelType = 'floor';

    if (customImg && stoneReq) {
      currentStone = { id: 'custom_url', name: stoneReq, cat: 'Custom', url: customImg };
      STONES.unshift(currentStone);
    } else if (stoneReq) {
      const match = STONES.find(s => s.name.toLowerCase() === stoneReq.toLowerCase() || s.id === stoneReq.toLowerCase());
      if (match) currentStone = match;
    }

    // ── Three.js Scene Setup ──
    const canvas = document.getElementById('arCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 3.5);

    // Realistic Showroom & Ambient Lighting
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2.2);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffeedd, 2.0);
    dirLight.position.set(3, 6, 4);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xffd588, 1.2, 8);
    pointLight.position.set(0, 2, 2);
    scene.add(pointLight);

    // Stone Slab Mesh & Floor Mesh Group
    const slabGroup = new THREE.Group();
    scene.add(slabGroup);

    const textureLoader = new THREE.TextureLoader();
    let slabMesh = null;
    let floorMesh = null;

    function build3DModels() {
      // 1. Standing Gangsaw Slab (2.8m x 1.6m x 0.03m)
      const slabGeo = new THREE.BoxGeometry(2.8, 1.6, 0.03);
      const slabMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.22,
        metalness: 0.05
      });
      slabMesh = new THREE.Mesh(slabGeo, slabMat);
      slabMesh.position.set(0, 0, 0);
      slabMesh.castShadow = true;
      slabGroup.add(slabMesh);

      // Gold Edge Frame & Chamfered Accent
      const edgeGeo = new THREE.BoxGeometry(2.82, 1.62, 0.032);
      const edgeMat = new THREE.MeshStandardMaterial({ color: 0x8F7034, metalness: 0.8, roughness: 0.3 });
      const edgeMesh = new THREE.Mesh(edgeGeo, edgeMat);
      edgeMesh.position.set(0, 0, -0.005);
      slabMesh.add(edgeMesh);

      // 2. Flat Floor Paving Grid (2.4m x 2.4m x 0.02m)
      const floorGeo = new THREE.BoxGeometry(2.4, 0.02, 2.4);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.25,
        metalness: 0.05
      });
      floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.position.set(0, -0.8, 0);
      floorMesh.visible = false;
      slabGroup.add(floorMesh);
    }

    build3DModels();

    // ── Apply Stone Texture ──
    function applyCurrentTexture() {
      document.getElementById('arStoneTitle').textContent = currentStone.name;
      textureLoader.load(currentStone.url, (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

        if (currentModelType === 'slab') {
          tex.repeat.set(1, 1);
          slabMesh.material.map = tex;
          slabMesh.material.needsUpdate = true;
        } else {
          tex.repeat.set(4, 4); // 4x4 tile paving grid
          floorMesh.material.map = tex;
          floorMesh.material.needsUpdate = true;
        }
      });
    }

    function switchModel(type) {
      currentModelType = type;
      if (type === 'slab') {
        slabMesh.visible = true;
        floorMesh.visible = false;
        camera.position.set(0, 1.2, 3.5);
        document.getElementById('arDimensions').textContent = '2.80m × 1.60m × 20mm (10 × 5.5 ft Gangsaw Slab)';
      } else {
        slabMesh.visible = false;
        floorMesh.visible = true;
        camera.position.set(0, 2.2, 3.0);
        document.getElementById('arDimensions').textContent = '2.40m × 2.40m (8.0 × 8.0 ft Floor Tile Grid)';
      }
      camera.lookAt(0, 0, 0);

      document.getElementById('btnModelSlab').className = currentModelType === 'slab' 
        ? 'px-3 py-1.5 rounded-full font-semibold transition bg-[#C5A059] text-black' 
        : 'px-3 py-1.5 rounded-full font-semibold transition text-zinc-400 hover:text-white';
      
      document.getElementById('btnModelFloor').className = currentModelType === 'floor' 
        ? 'px-3 py-1.5 rounded-full font-semibold transition bg-[#C5A059] text-black' 
        : 'px-3 py-1.5 rounded-full font-semibold transition text-zinc-400 hover:text-white';

      applyCurrentTexture();
    }

    // ── Camera Video Feed (Live AR Mode) ──
    async function initDeviceCamera() {
      const video = document.getElementById('cameraVideo');
      const banner = document.getElementById('cameraBanner');
      const badge = document.getElementById('arStatusBadge');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();
        video.classList.remove('hidden');
        isCameraActive = true;

        if (badge) {
          badge.textContent = 'Camera AR Active';
          badge.classList.remove('text-[#C5A059]');
          badge.classList.add('text-emerald-400');
        }

        // Hide start banner
        if (banner) banner.style.display = 'none';

        // Adjust 3D positioning for direct room projection
        slabGroup.position.set(0, -0.2, 0);
      } catch (err) {
        console.warn('Camera stream error:', err);
        alert('Camera access was not granted. You can still inspect and position this slab in 3D studio mode!');
      }
    }

    // Auto-prompt camera if on mobile device
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      setTimeout(() => {
        // Automatically offer camera activation
        const btn = document.getElementById('btnStartCamera');
        if (btn) btn.click();
      }, 500);
    }

    // ── Touch & Mouse Controls: Move, Pinch-to-scale, Rotate ──
    let isDragging = false;
    let prevMousePos = { x: 0, y: 0 };
    let initialPinchDist = null;
    let initialScale = 1;

    function getTouchDist(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        prevMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDist = getTouchDist(e);
        initialScale = slabGroup.scale.x;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isDragging) {
        const dx = (e.touches[0].clientX - prevMousePos.x) * 0.005;
        const dy = (e.touches[0].clientY - prevMousePos.y) * 0.005;
        slabGroup.position.x += dx;
        slabGroup.position.y -= dy;
        prevMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2 && initialPinchDist) {
        const newDist = getTouchDist(e);
        const factor = newDist / initialPinchDist;
        const newScale = Math.max(0.3, Math.min(2.5, initialScale * factor));
        slabGroup.scale.set(newScale, newScale, newScale);
      }
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      isDragging = false;
      initialPinchDist = null;
    });

    // Mouse drag for desktop testing
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      prevMousePos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = (e.clientX - prevMousePos.x) * 0.005;
      const dy = (e.clientY - prevMousePos.y) * 0.005;
      slabGroup.position.x += dx;
      slabGroup.position.y -= dy;
      prevMousePos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Wheel to zoom/scale
    canvas.addEventListener('wheel', (e) => {
      const zoom = e.deltaY > 0 ? 0.95 : 1.05;
      const newScale = Math.max(0.3, Math.min(2.5, slabGroup.scale.x * zoom));
      slabGroup.scale.set(newScale, newScale, newScale);
    });

    function resetSlabPosition() {
      slabGroup.position.set(0, 0, 0);
      slabGroup.rotation.set(0, 0, 0);
      slabGroup.scale.set(1, 1, 1);
    }

    // ── Swatches Dock ──
    function initDock() {
      const dock = document.getElementById('stoneDock');
      dock.innerHTML = '';
      STONES.forEach(s => {
        const item = document.createElement('button');
        item.className = `stone-card shrink-0 flex items-center gap-2 p-1.5 pr-3 rounded-xl bg-white/5 border ${s === currentStone ? 'active border-[#C5A059]' : 'border-white/10'} hover:bg-white/10 text-left transition`;
        item.onclick = () => selectStone(s);
        item.innerHTML = `
          <img src="${s.url}" alt="${s.name}" class="w-10 h-10 rounded-lg object-cover border border-white/10">
          <div>
            <div class="text-xs font-bold text-white whitespace-nowrap">${s.name}</div>
            <div class="text-[10px] text-[#C5A059]">${s.cat}</div>
          </div>
        `;
        dock.appendChild(item);
      });
    }

    function selectStone(s) {
      currentStone = s;
      document.querySelectorAll('.stone-card').forEach(c => c.classList.remove('active', 'border-[#C5A059]'));
      if (event && event.currentTarget) event.currentTarget.classList.add('active', 'border-[#C5A059]');
      applyCurrentTexture();
      updateQrCode();
    }

    // ── QR Code Generation: Local Wi-Fi vs Cloud GitHub Pages ──
    let qrMode = 'wifi';
    function setQrType(type) {
      qrMode = type;
      document.getElementById('btnQrWifi').className = type === 'wifi' ? 'flex-1 py-1 rounded bg-[#C5A059] text-black font-bold' : 'flex-1 py-1 rounded bg-white/10 text-zinc-300';
      document.getElementById('btnQrCloud').className = type === 'cloud' ? 'flex-1 py-1 rounded bg-[#C5A059] text-black font-bold' : 'flex-1 py-1 rounded bg-white/10 text-zinc-300';
      updateQrCode();
    }

    function updateQrCode() {
      const qrImg = document.getElementById('qrImg');
      if (!qrImg) return;

      let targetUrl = '';
      if (qrMode === 'cloud' || (!window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1'))) {
        targetUrl = `https://cyber-atharv.github.io/web-stones/pages/ar-viewer.html?stone=${encodeURIComponent(currentStone.name)}&model=${currentModelType}`;
      } else {
        // Local Network IP for same Wi-Fi connection
        const wifiIp = '10.86.59.159';
        targetUrl = `http://${wifiIp}:8092/pages/ar-viewer.html?stone=${encodeURIComponent(currentStone.name)}&model=${currentModelType}`;
      }
      qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(targetUrl)}`;
    }

    // ── WhatsApp Direct Share ──
    function shareToWhatsApp() {
      const msg = `Hello Murali Granites, I am previewing ${currentStone.name} in 1:1 Augmented Reality (AR) on your website. Please share availability and live lot pricing.`;
      window.open(`https://wa.me/919443226344?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // ── Render Loop ──
    function animate() {
      requestAnimationFrame(animate);
      if (!isDragging && !isCameraActive) {
        // Gentle subtle showcase turntable rotation when idle
        slabGroup.rotation.y += 0.003;
      }
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Expose helpers globally
    window.switchModel = switchModel;
    window.selectStone = selectStone;
    window.initDeviceCamera = initDeviceCamera;
    window.resetSlabPosition = resetSlabPosition;
    window.shareToWhatsApp = shareToWhatsApp;
    window.setQrType = setQrType;

    initDock();
    applyCurrentTexture();
    updateQrCode();
    animate();
  </script>
</body>
</html>
